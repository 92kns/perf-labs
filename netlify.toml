# Proxy external dashboards under this site's own origin so they can be embedded
# same-origin (enables reading the iframe's URL for shareable deep links without
# postMessage). A 200 rewrite serves the remote content in place; query strings
# are forwarded automatically.
#
# One explicit rule per dashboard, mirroring manifest.json. To add a dashboard:
#   1. add its entry to manifest.json (url = the "from" path below)
#   2. add a matching [[redirects]] block here (from -> to)
# Only the paths listed here are proxied; anything else 404s.

# telemetry-alert-dashboard  ->  https://gmierz.github.io/telemetry-alert-dashboard/
[[redirects]]
  from = "/gh/telemetry-alert-dashboard/*"
  to = "https://gmierz.github.io/telemetry-alert-dashboard/:splat"
  status = 200
  force = true

# nova-compare  ->  https://gmierz.github.io/nova-compare/
[[redirects]]
  from = "/gh/nova-compare/*"
  to = "https://gmierz.github.io/nova-compare/:splat"
  status = 200
  force = true

# perfherder2  ->  https://perfherder2.netlify.app/
[[redirects]]
  from = "/app/perfherder2/*"
  to = "https://perfherder2.netlify.app/:splat"
  status = 200
  force = true

# perfherder2 is a Vite build served from the root of its own site, so its HTML
# references assets with absolute paths ("/assets/index-*.js", "/favicon.svg")
# rather than relative ones. Under the subpath proxy above those requests land on
# this site's root, so they need their own rules. This claims /assets/* site-wide,
# which is fine while perfherder2 is the only dashboard using absolute paths.
# The cleaner fix is to set Vite's `base` to "/app/perfherder2/" in perfherder2
# itself, after which these two rules can be dropped.
[[redirects]]
  from = "/assets/*"
  to = "https://perfherder2.netlify.app/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/favicon.svg"
  to = "https://perfherder2.netlify.app/favicon.svg"
  status = 200
  force = true
